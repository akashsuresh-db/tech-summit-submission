command:
  - uvicorn
  - server.main:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"

env:
  - name: LAKEBASE_PROJECT
    value: meridian-bank
  - name: LAKEBASE_BRANCH
    value: production
  - name: LAKEBASE_ENDPOINT
    value: primary
  - name: MERIDIAN_CHAT_MODEL
    value: databricks-claude-haiku-4-5
